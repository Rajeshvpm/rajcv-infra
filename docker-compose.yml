services:
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: rajcv-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/html:/usr/share/nginx/html:ro
      - nginx-logs:/var/log/nginx  # Added this to allow mtail to read logs
    networks:
      - internal

  backend-app:
    image: node:18-alpine
    container_name: rajcv-backend
    working_dir: /app
    restart: unless-stopped
    volumes:
      - ./backend:/app
      - /app/node_modules
    command: sh -c "npm install express nodemailer && node server.js"
    networks:
      - internal

  mtail:
    image: ghcr.io/google/mtail:latest
    container_name: rajcv-mtail
    restart: unless-stopped
    networks:
      - internal
    command: ["--logs", "/var/log/nginx/access.log", "--progs", "/progs", "--logtostderr"]
    volumes:
      - nginx-logs:/var/log/nginx:ro
      - ./mtail:/progs:ro
    ports:
      - "3903:3903"

  grafana:
    image: grafana/grafana:latest
    container_name: rajcv-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:?GRAFANA_PASSWORD not set}
      - GF_SERVER_ROOT_URL=https://grafana.rajcv.online
      - GF_SERVER_SERVE_FROM_SUB_PATH=false
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_SECURITY_DISABLE_GRAVATAR=true
      - GF_FEATURE_TOGGLES_ENABLE=kubernetesClientDashboardsFolders=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - internal
    depends_on:
      - loki
      - prometheus

  loki:
    image: grafana/loki:latest
    container_name: rajcv-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki_data:/loki
      - ./grafana/loki-config.yaml:/etc/loki/local-config.yaml:ro
    networks:
      - internal

  promtail:
    image: grafana/promtail:latest
    container_name: rajcv-promtail
    restart: unless-stopped
    command: -config.file=/etc/promtail/config.yaml
    volumes:
      - ./grafana/promtail-config.yaml:/etc/promtail/config.yaml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/log:/var/log:ro
    networks:
      - internal
    depends_on:
      - loki

  prometheus:
    image: prom/prometheus:latest
    container_name: rajcv-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=30d
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - internal

  node-exporter:
    image: prom/node-exporter:latest
    container_name: rajcv-node-exporter
    restart: unless-stopped
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --collector.filesystem.ignored-mount-points=^/(sys|proc|dev|host|etc)($$|/)
    networks:
      - internal

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: rajcv-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN:?CLOUDFLARE_TUNNEL_TOKEN not set}
    networks:
      - internal
    depends_on:
      - nginx
      - grafana

# --- Top Level Definitions (No Indentation) ---
networks:
  internal:
    driver: bridge

volumes:
  grafana_data:
  loki_data:
  prometheus_data:
  nginx-logs:
