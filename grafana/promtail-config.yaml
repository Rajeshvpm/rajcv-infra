server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    static_configs:
      - targets:
          - localhost
        labels:
          job: docker
          service_name: docker
          __path__: /var/lib/docker/containers/*/*-json.log
    pipeline_stages:
      - json:
          expressions:
            output: log
            stream: stream
            time: time
      - timestamp:
          format: RFC3339Nano
          source: time
      - output:
          source: output

  - job_name: nginx
    static_configs:
      - targets:
          - localhost
        labels:
          job: nginx
          container: rajcv-nginx
          __path__: /var/log/nginx/access.log
    pipeline_stages:
      - json:
          expressions:
            status: status
            request_uri: request_uri
            request_time: request_time
            request_method: request_method
            client_ip: http_x_forwarded_for
      - geoip:
          db: /etc/promtail/GeoLite2-City.mmdb
          source: client_ip
          db_type: city
      - labels:
          status:
          request_uri:
          geoip_country_name:
          geoip_city_name:
