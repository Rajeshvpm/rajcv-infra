<!DOCTYPE html>
<head>
    <link rel="icon" type="image/png" sizes="32x32" href="logo.png">
</head>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raj service portal</title>
    <style>
        :root { --primary: #000; --bg: #f8f7f2; --card: #fff; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); margin: 0; color: var(--primary); }
        header { padding: 40px 10%; display: flex; justify-content: space-between; align-items: center; }
        .hero { text-align: center; padding: 60px 10%; }
        .hero h1 { font-size: 4rem; margin-bottom: 10px; }
        .hero p { font-size: 1.2rem; color: #666; }

        .tabs { display: flex; justify-content: center; gap: 20px; margin-bottom: 40px; }
        .tabs button { background: none; border: 1px solid #ddd; padding: 12px 24px; border-radius: 30px; cursor: pointer; font-weight: 600; }
        .tabs button.active { background: var(--primary); color: white; border-color: var(--primary); }

        .container { max-width: 800px; margin: auto; background: var(--card); padding: 40px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        label { display: block; margin: 15px 0 5px; font-weight: bold; }
        input, textarea, select { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        .btn-submit { background: var(--primary); color: white; border: none; padding: 15px; width: 100%; border-radius: 8px; font-size: 1rem; cursor: pointer; margin-top: 20px; }
    </style>
</head>
<body>

    <header>
        <div style="font-weight: bold; font-size: 1.5rem;"></div>
        <nav>T11,503 </nav>
    </header>

    <section class="hero">
        <h1>Welcome Book your service Request</h1>
        <p>Feel like your home is unclean or something’s bothering you? No problem—just book a request.</p>
    </section>

    <div class="tabs">
        <button id="btn1" class="active" onclick="showTab(event, 'cleaning')">Services</button>
        <button id="btn2" onclick="showTab(event, 'help')">Favours & Help </button>
    </div>

    <div class="container">
        <div id="cleaning" class="tab-content active">
            <form onsubmit="handleSubmit(event, 'cleaning')">
                <label>Name</label>
                <input type="text" id="name1" placeholder="Your Name" required>
                <label>Service List</label>
                <select id="task1"  name="serviceList">
                    <option value="">Select a service...</option>
                    <option value="deep-cleaning">Deep Cleaning</option>
                    <option value="kitchen-cleaning">Kitchen Deep Clean</option>
		    <option value="kitchen-cleaning">Kitchen Counter top </option>
		    <option value="kitchen-cleaning">Gas cleaning </option>
		    <option value="Fride-cleaning">Fridge Cleaning Rack 1 </option>
		    <option value="Fride-cleaning"> EntireFridge Cleaning </option>
		    <option value="Floor Cleaning"> Moop Hall  </option>
		    <option value="Floor Cleaning"> Moop Entire home </option>
		    <option value="Trash clearing "> Trash Clearing </option>
                    <option value="bathroom-cleaning">Bathroom Sanitization</option>
                    <option value="window-cleaning">Sweep Hall</option>
                    <option value="carpet-cleaning">Sweep Entire Home </option>
                    <option value="move-out">Clean Ashes</option>
                </select>
                <label>Regular/Ocd psyche cleaning </label>
                <input type="text" id="cost1" placeholder="Regualar No Cost / OCD type your willing payment e.g. Buying next: Breakfast/detergent/trash cover" required>
                <label>Preferred Date</label>
                <input type="datetime-local" id="time1" required>
                <button type="submit" class="btn-submit">Book Cleaning Request</button>
            </form>
        </div>

        <div id="help" class="tab-content">
            <form onsubmit="handleSubmit(event, 'help')">
                <label>What favour can I do for you?</label>
                <textarea id="desc2" rows="6" placeholder="Favours should be repaid with favours - ask for them with caution.  " required></textarea>
                <button type="submit" class="btn-submit">Send Message</button>
            </form>
        </div>
    </div>


    <script>
    // Handles switching between the two tabs
    function showTab(event, id) {
        document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.tabs button').forEach(el => el.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        if (event?.currentTarget) {
            event.currentTarget.classList.add('active');
        }
    }

    // Handles the actual data sending
    async function handleSubmit(e, type) {
        e.preventDefault();

        
	// Capture common fields
	const nameValue = document.getElementById('name1')?.value || document.getElementById('name2')?.value || "Guest User";
        const costValue = document.getElementById('cost1')?.value || "As agreed";
        const timeValue = document.getElementById('time1')?.value || "Flexible";

        // Create the data object based on the tab 'type'
        let data = {
            name: nameValue,
            cost: costValue,
            availability: timeValue
        };

        if (type === 'cleaning') {
            data.task = document.getElementById('task1').value;
            data.description = null; // Tell backend this is NOT a help request
        } else {
            data.description = document.getElementById('desc2').value;
            data.task = null; // Tell backend this is NOT a cleaning request
        }

        try {
            const response = await fetch('/api/submit', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });

            if (response.ok) {
                alert("Hi " + nameValue + ", your request has been sent!");
                e.target.reset(); // Clears the form fields
            } else {
                alert("Error: Server returned " + response.status);
            }
        } catch (error) {
            console.error("Network Error:", error);
            alert("Network error. Please check if the backend service is running.");
        }
    }
    </script>   
</body>
</html>
