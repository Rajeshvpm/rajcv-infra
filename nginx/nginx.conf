worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    # JSON Log Format - Must be inside http, outside server
    log_format json_analytics escape=json '{'
        '"msec":"$msec",'
        '"time_iso8601":"$time_iso8601",'
        '"time_local":"$time_local",'
        '"remote_addr":"$remote_addr",'
        '"remote_user":"$remote_user",'
        '"request":"$request",'
        '"request_method":"$request_method",'
        '"request_uri":"$request_uri",'
        '"request_time":"$request_time",'
        '"status":"$status",'
        '"body_bytes_sent":"$body_bytes_sent",'
        '"bytes_sent":"$bytes_sent",'
        '"http_referer":"$http_referer",'
        '"http_user_agent":"$http_user_agent",'
        '"http_x_forwarded_for":"$http_x_forwarded_for",'
        '"upstream_addr":"$upstream_addr",'
        '"upstream_status":"$upstream_status",'
        '"upstream_response_time":"$upstream_response_time",'
        '"upstream_connect_time":"$upstream_connect_time",'
        '"upstream_header_time":"$upstream_header_time"'
    '}';

    # Tell Nginx to use the new format
    access_log /var/log/nginx/access.log json_analytics;

    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;
        server_tokens off;
        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-Content-Type-Options "nosniff";
        add_header Referrer-Policy "no-referrer-when-downgrade";
        autoindex off;

        # 1. Homepage - exact match only
        location = / {
            try_files /index.html =404;
        }

        # 2. /services - your valid route
        location /services {
            alias /usr/share/nginx/html/services/;
            index index.html;
        }

        # 3. API - proxy to backend
        location /api/ {
            proxy_pass http://backend-app:5000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # 4. Static assets - only serve if file exists
        location ~* \.(jpg|jpeg|png|gif|ico|css|js|woff2|svg|ttf|woff)$ {
            expires 7d;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # 5. Health check
        location /healthz {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }

        # 6. Nginx metrics (Stub Status)
        location /nginx_status {
            stub_status on;
            access_log off;
        }
        # 7. Everything else → custom 404
        location / {
            return 404;
        }

        # 8. Custom error page config
        error_page 404 /errorpage/index.html;
        location = /errorpage/index.html {
            root /usr/share/nginx/html;
            internal;
        }
    }
}
