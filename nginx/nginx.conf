worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # JSON Log Format
    log_format json_analytics escape=json '{'
        '"msec":"$msec",'
        '"time_iso8601":"$time_iso8601",'
        '"time_local":"$time_local",'
        '"remote_addr":"$remote_addr",'
        '"remote_user":"$remote_user",'
        '"request":"$request",'
        '"request_method":"$request_method",'
        '"request_uri":"$request_uri",'
        '"request_time":"$request_time",'
        '"status":"$status",'
        '"body_bytes_sent":"$body_bytes_sent",'
        '"bytes_sent":"$bytes_sent",'
        '"http_referer":"$http_referer",'
        '"http_user_agent":"$http_user_agent",'
        '"http_x_forwarded_for":"$http_x_forwarded_for",'
        '"upstream_addr":"$upstream_addr",'
        '"upstream_status":"$upstream_status",'
        '"upstream_response_time":"$upstream_response_time",'
        '"upstream_connect_time":"$upstream_connect_time",'
        '"upstream_header_time":"$upstream_header_time"'
    '}';

    # Tell Nginx to use the new format
    access_log /var/log/nginx/access.log json_analytics;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    
    # CRITICAL: Tells Mailu's internal SSO that the web browser outside is safely running HTTPS!
    proxy_set_header X-Forwarded-Proto https;
    
    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # Security Headers
        server_tokens off;
        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-Content-Type-Options "nosniff";
        add_header Referrer-Policy "no-referrer-when-downgrade";
        autoindex off;

        # 1. Homepage - exact match only
        location = / {
            try_files /index.html =404;
        }

        # 2. Static path routes
        location /services {
            alias /usr/share/nginx/html/services/;
            index index.html;
        }

        # 3. Backend App Proxies
        location /api/ {
            proxy_pass http://rajcv-backend:3000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        location /tickets {
           proxy_pass http://rajcv-backend:3000;
           proxy_set_header Host $host;
        }

        location /tickets.html {
           proxy_pass http://rajcv-backend:3000;
           proxy_set_header Host $host;
        }

        # 4. Infrastructure Proxies (Kafka UI)
        location /kafka/ {
           proxy_pass http://rajcv-kafka-ui:8080/kafka/;
           proxy_set_header Host $host;
           proxy_set_header X-Real-IP $remote_addr;
           proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
           proxy_set_header X-Forwarded-Proto https;
        }

        # Mailu — all web interfaces
        

                # 5. FIXED: Mailu Route Handlers (Uses standard prefix matching instead of regex)
        

        # ── Mailu — single regex block per official docs ──────────
        location ~* ^/(admin|sso|static|webdav|webmail|rspamd|apple\.mobileconfig|mobileconfig|\.well-known/autoconfig|Autodiscover) {
            proxy_pass https://rajcv-mailu-front:443;
            proxy_ssl_verify off;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_redirect https://rajcv-mailu-front https://rajcv.online;
            proxy_redirect http://rajcv-mailu-front https://rajcv.online;
            proxy_connect_timeout 10s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;
        }


        # 8. Monitoring & Observability
        location /healthz {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }

        location /nginx_status {
            stub_status on;
            access_log off;
        }

        # 9. Static Assets Regex Evaluation
        # Negative lookahead protects proxied routes from regex intercept matching
        location ~* ^(?!/kafka/|/admin/|/webmail/|/sso/|/api/|/rspamd|/static/).*\.(jpg|jpeg|png|gif|ico|css|js|woff2|svg|ttf|woff)$ {
            expires 7d;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # 10. Fallback Catch-All
        location / {
            return 404;
        }

        # 11. Custom Error Handler
        error_page 404 /errorpage/index.html;
        location = /errorpage/index.html {
            root /usr/share/nginx/html;
            internal;
        }
    }
}
